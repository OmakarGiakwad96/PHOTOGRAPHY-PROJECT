spring.application.name=photohub

# Server Port
server.port=8086

# MySQL Database Configuration (production)
spring.datasource.url=jdbc:mysql://localhost:3306/photohub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=manager

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
# Use a strong base64 encoded secret in production
app.jwt.secret=4f7831d4512db26a111a681c2f10b7f847f9c8f02901353c7c25c381c15f9b42
# 7 days in milliseconds
app.jwt.expiration-ms=604800000

# Springdoc OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
