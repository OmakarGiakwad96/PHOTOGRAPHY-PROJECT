services:
  # -------------------------------------
  # Database Service
  # -------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - photohub-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10
      start_period: 10s

  # -------------------------------------
  # Spring Boot Backend
  # -------------------------------------
  springboot-backend:
    build:
      context: ./Backed_Java/backend_java
      dockerfile: Dockerfile
    container_name: springboot_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - photohub-network

  # -------------------------------------
  # React/Vite Frontend
  # -------------------------------------
  react-frontend:
    build:
      context: ./Frontend/photohub
      dockerfile: Dockerfile
    container_name: react_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - springboot-backend
      - api-gateway
    networks:
      - photohub-network

  # -------------------------------------
  # Central API Gateway
  # -------------------------------------
  api-gateway:
    build:
      context: ./API_Gateway
      dockerfile: Dockerfile
    container_name: api_gateway
    restart: unless-stopped

    ports :
      - "3001:3000"
      
    depends_on:
      - springboot-backend
      - dotnet-service
      - python-fastapi
    environment:
      - JAVA_TARGET=http://springboot-backend:8080
      - DOTNET_TARGET=http://dotnet-service:5000
      - PYTHON_TARGET=http://python-fastapi:8000
    networks:
      - photohub-network

  # -------------------------------------
  # .NET Payment / Notification Service
  # -------------------------------------
  dotnet-service:
    build:
      context: ./Backend_Dotnet/dotnetBackend
      dockerfile: Dockerfile
    container_name: dotnet_service
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - photohub-network

  # -------------------------------------
  # Python FastAPI / LensBuddy
  # -------------------------------------
  python-fastapi:
    build:
      context: ./Python/GenAI_Python
      dockerfile: Dockerfile
    container_name: python_fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - photohub-network

networks:
  photohub-network:
    driver: bridge

volumes:
  mysql_data: